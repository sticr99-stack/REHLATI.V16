# رحلتي — تشغيل إنتاجي بأمر واحد: docker compose up -d --build
# قاعدة البيانات: حاوية Postgres مدمجة ببياناتها المحفوظة (لا يحتاج Neon على VPS)
services:
  rehlati:
    build: .
    container_name: rehlati
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # عدّل هذه القيم أو استخدم ملف .env
      - DATABASE_URL=postgresql://rehlati:rehlati@postgres:5432/rehlati?sslmode=disable
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - DUFFEL_API_TOKEN=${DUFFEL_API_TOKEN:-}
      - AMADEUS_CLIENT_ID=${AMADEUS_CLIENT_ID:-}
      - AMADEUS_CLIENT_SECRET=${AMADEUS_CLIENT_SECRET:-}
    ports:
      - "3000:3000"
    # إنشاء/تحديث جداول القاعدة عند كل إقلاع (idempotent) ثم تشغيل السيرفر
    command: sh -c "npx prisma db push --skip-generate && node server.js"

  postgres:
    image: postgres:16-alpine
    container_name: rehlati-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=rehlati
      - POSTGRES_PASSWORD=rehlati
      - POSTGRES_DB=rehlati
    volumes:
      # بيانات القاعدة تبقى محفوظة حتى بعد إعادة البناء
      - rehlati-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rehlati -d rehlati"]
      interval: 5s
      timeout: 5s
      retries: 12

  # وكيل عكسي مع HTTPS تلقائي — عدّل النطاق ثم: docker compose up -d
  caddy:
    image: caddy:2-alpine
    container_name: rehlati-caddy
    restart: unless-stopped
    depends_on:
      - rehlati
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  rehlati-pgdata:
  caddy-data:
  caddy-config:
