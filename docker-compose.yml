# رحلتي — تشغيل إنتاجي بأمر واحد: docker compose up -d --build
services:
  rehlati:
    build: .
    container_name: rehlati
    restart: unless-stopped
    environment:
      # عدّل هذه القيم أو استخدم ملف .env
      - DATABASE_URL=file:/app/db/custom.db
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - AMADEUS_CLIENT_ID=${AMADEUS_CLIENT_ID:-}
      - AMADEUS_CLIENT_SECRET=${AMADEUS_CLIENT_SECRET:-}
    volumes:
      # قاعدة البيانات تبقى محفوظة حتى بعد إعادة البناء
      - rehlati-db:/app/db
    ports:
      - "3000:3000"

  # وكيل عكسي مع HTTPS تلقائي — عدّل النطاق ثم: docker compose up -d
  caddy:
    image: caddy:2-alpine
    container_name: rehlati-caddy
    restart: unless-stopped
    depends_on:
      - rehlati
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  rehlati-db:
  caddy-data:
  caddy-config:
